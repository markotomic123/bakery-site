<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>North Star Bakery - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>Inquiry Form</h2>
      <form method="post" action="#">
        <fieldset>
          <legend>Pre‑Order Request</legend>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required><br><br>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required><br><br>

          <label for="pickup">Pickup Date:</label>
          <input type="date" id="pickup" name="pickup" required><br><br>

          <label for="item">Item Details:</label>
          <input type="text" id="item" name="item" required><br><br>

          <label for="allergy">Allergy Notes:</label>
          <textarea id="allergy" name="allergy"></textarea><br><br>

          <input type="submit" value="Submit">
        </fieldset>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 North Star Bakery</p>
  </footer>
</body>
</html>
